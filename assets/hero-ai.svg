<svg width="800" height="300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AI Developer Hero">
    <rect width="100%" height="100%" fill="#0D1117" rx="10"/>
    <defs>
        <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.8"/>
            <stop offset="100%" stop-color="#0D1117" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="scanLine" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#00F0FF" stop-opacity="0"/>
            <stop offset="50%" stop-color="#00F0FF" stop-opacity="0.5"/>
            <stop offset="100%" stop-color="#00F0FF" stop-opacity="0"/>
        </linearGradient>
    </defs>
    <!-- Background grid -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
        <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#21262d" stroke-width="1"/>
    </pattern>
    <rect width="100%" height="100%" fill="url(#grid)" rx="10"/>
    
    <!-- Title -->
    <text x="400" y="70" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="2">THUGU GANESH KUMAR REDDY</text>
    <text x="400" y="105" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#00F0FF" text-anchor="middle" letter-spacing="4">AI &amp; FRONT-END DEVELOPER</text>
    <text x="400" y="135" font-family="Arial, sans-serif" font-size="12" fill="#8b949e" text-anchor="middle" letter-spacing="1">Artificial Intelligence • Machine Learning • Computer Vision • React.js</text>
    
    <!-- AI Core Visualization -->
    <g transform="translate(400, 220)">
        <circle cx="0" cy="0" r="40" fill="url(#coreGlow)">
            <animate attributeName="r" values="35;45;35" dur="3s" repeatCount="indefinite"/>
            <animate attributeName="opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite"/>
        </circle>
        
        <!-- Orbits -->
        <g>
            <circle cx="0" cy="0" r="50" fill="none" stroke="#30363d" stroke-width="1" stroke-dasharray="4 4"/>
            <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="20s" repeatCount="indefinite"/>
        </g>
        <g>
            <circle cx="0" cy="0" r="70" fill="none" stroke="#30363d" stroke-width="1" stroke-dasharray="10 5"/>
            <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="30s" repeatCount="indefinite"/>
        </g>
        
        <!-- Neural Nodes -->
        <line x1="0" y1="0" x2="-80" y2="-20" stroke="#00F0FF" stroke-width="1" stroke-dasharray="2 2" opacity="0.5"/>
        <line x1="0" y1="0" x2="80" y2="-20" stroke="#00F0FF" stroke-width="1" stroke-dasharray="2 2" opacity="0.5"/>
        <line x1="0" y1="0" x2="-40" y2="30" stroke="#00F0FF" stroke-width="1" stroke-dasharray="2 2" opacity="0.5"/>
        <line x1="0" y1="0" x2="40" y2="30" stroke="#00F0FF" stroke-width="1" stroke-dasharray="2 2" opacity="0.5"/>
        
        <circle cx="-80" cy="-20" r="4" fill="#B900FF"/>
        <circle cx="80" cy="-20" r="4" fill="#B900FF"/>
        <circle cx="-40" cy="30" r="4" fill="#B900FF"/>
        <circle cx="40" cy="30" r="4" fill="#B900FF"/>
        <circle cx="0" cy="0" r="6" fill="#00F0FF"/>
        
        <!-- Moving Data Particles -->
        <circle r="2" fill="#ffffff">
            <animateMotion path="M 0 0 L -80 -20" dur="2s" repeatCount="indefinite"/>
        </circle>
        <circle r="2" fill="#ffffff">
            <animateMotion path="M 0 0 L 80 -20" dur="2.5s" repeatCount="indefinite"/>
        </circle>
        <circle r="2" fill="#ffffff">
            <animateMotion path="M -40 30 L 0 0" dur="1.5s" repeatCount="indefinite"/>
        </circle>
    </g>
    
    <!-- System Status labels -->
    <text x="20" y="270" font-family="Courier New, monospace" font-size="10" fill="#00F0FF">SYS_ONLINE</text>
    <text x="700" y="270" font-family="Courier New, monospace" font-size="10" fill="#00F0FF">AI_CORE_ACTIVE</text>
    
    <!-- Scanning Line -->
    <rect x="0" y="0" width="800" height="2" fill="url(#scanLine)">
        <animate attributeName="y" values="0;300;0" dur="8s" repeatCount="indefinite"/>
    </rect>
</svg>
