<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 460" width="100%" height="100%">
  <defs>
    <linearGradient id="panelBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040712" />
      <stop offset="50%" stop-color="#0A1024" />
      <stop offset="100%" stop-color="#030610" />
    </linearGradient>

    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <linearGradient id="cyanBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <pattern id="dotGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1E293B" opacity="0.4" />
    </pattern>
  </defs>

  <style>
    @keyframes lineDash {
      0% { stroke-dashoffset: 200; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes rippleNode1 {
      0% { r: 6px; opacity: 1; stroke-width: 2px; }
      100% { r: 24px; opacity: 0; stroke-width: 0.5px; }
    }
    @keyframes rippleNode2 {
      0% { r: 6px; opacity: 1; stroke-width: 2px; }
      100% { r: 24px; opacity: 0; stroke-width: 0.5px; }
    }
    @keyframes raceParticle1 {
      0% { transform: translateY(0px); opacity: 0; }
      20% { opacity: 1; }
      80% { opacity: 1; }
      100% { transform: translateY(320px); opacity: 0; }
    }

    .section-title { font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 800; fill: #FFFFFF; font-size: 16px; letter-spacing: 2px; }
    .exp-title { font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 800; fill: #00F0FF; font-size: 14.5px; }
    .org-text { font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 600; fill: #E2E8F0; font-size: 13px; }
    .date-text { font-family: 'Courier New', monospace; font-size: 12px; fill: #C084FC; font-weight: 600; }
    .bullet-text { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 12px; fill: #94A3B8; line-height: 1.5; }
    .metric-badge { font-family: 'Courier New', monospace; font-size: 11px; fill: #00F0FF; font-weight: 700; }

    .dash-line { stroke-dasharray: 12 8; animation: lineDash 3s linear infinite; }
    .r-node1 { animation: rippleNode1 2s ease-out infinite; transform-origin: 55px 85px; }
    .r-node2 { animation: rippleNode2 2s ease-out infinite 1s; transform-origin: 55px 270px; }
    .p-race1 { animation: raceParticle1 3.5s ease-in-out infinite; }
  </style>

  <!-- Container Box -->
  <rect width="850" height="460" rx="14" fill="url(#panelBg)" stroke="#1E293B" stroke-width="1.5" />
  <rect width="850" height="460" rx="14" fill="url(#dotGrid)" />

  <!-- Section Header -->
  <g transform="translate(30, 25)">
    <circle cx="6" cy="6" r="4" fill="#00F0FF" filter="url(#glow)" />
    <text x="20" y="10" class="section-title">RESEARCH &amp; ENGINEERING EXPERIMENTS // INTERNSHIPS</text>
    <line x1="0" y1="22" x2="790" y2="22" stroke="#1E293B" stroke-width="1" />
    <line x1="0" y1="22" x2="310" y2="22" stroke="url(#lineGrad)" stroke-width="2.5" filter="url(#glow)" />
  </g>

  <!-- Animated Timeline Axis -->
  <g transform="translate(55, 75)">
    <line x1="0" y1="0" x2="0" y2="340" stroke="#1E293B" stroke-width="3" />
    <line x1="0" y1="0" x2="0" y2="340" stroke="url(#lineGrad)" stroke-width="2.5" class="dash-line" filter="url(#glow)" />
    
    <!-- Energy Particle -->
    <circle cx="0" cy="0" r="4" fill="#00F0FF" class="p-race1" filter="url(#glow)" />
  </g>

  <!-- EXPERIENTIAL NODE 1: Vision Technology Lab, IIT Tirupati -->
  <g transform="translate(45, 75)">
    <!-- Node Marker -->
    <circle cx="10" cy="10" fill="none" stroke="#00F0FF" class="r-node1" />
    <circle cx="10" cy="10" r="7" fill="#00F0FF" filter="url(#glow)" />
    <circle cx="10" cy="10" r="3" fill="#FFFFFF" />

    <!-- Content Card -->
    <g transform="translate(35, -5)">
      <rect width="730" height="160" rx="10" fill="#0B1020" stroke="#1E293B" stroke-width="1" />
      <line x1="0" y1="0" x2="730" y2="0" stroke="url(#cyanBlue)" stroke-width="2.5" filter="url(#glow)" />
      
      <!-- Top Title Row -->
      <text x="20" y="26" class="exp-title">AI Research Intern</text>
      <text x="160" y="26" class="org-text">— Vision Technology Lab, IIT Tirupati</text>
      
      <!-- Date Pill -->
      <rect x="575" y="10" width="140" height="24" rx="12" fill="#1E1B4B" stroke="#8B5CF6" stroke-width="1" />
      <text x="587" y="26" class="date-text">May 2026 – Jul 2026</text>

      <!-- Project Subtitle -->
      <text x="20" y="48" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#38BDF8">
        Project: ShreeAkshara OCR – Indic Script Style Adaptation and Augmentation
      </text>

      <!-- Bullets matching resume -->
      <text x="20" y="72" class="bullet-text">
        • Collaborated on the ShreeAkshara-OCR project by creating a synthetic dataset from Devanagari and Sharada scripts
      </text>
      <text x="28" y="90" class="bullet-text">
        using Diffusion-based Style Transfer and DocCreator degradation techniques.
      </text>
      <text x="20" y="114" class="bullet-text">
        • Generated augmented document images to support OCR model training and improve recognition across different
      </text>
      <text x="28" y="132" class="bullet-text">
        writing styles and document conditions.
      </text>

      <!-- Key Tech Tag -->
      <rect x="505" y="125" width="210" height="22" rx="4" fill="#06202A" stroke="#00F0FF" stroke-width="1" />
      <text x="515" y="140" class="metric-badge">DIFFUSION STYLE TRANSFER // OCR</text>
    </g>
  </g>

  <!-- EXPERIENTIAL NODE 2: StudyOwl Education -->
  <g transform="translate(45, 260)">
    <!-- Node Marker -->
    <circle cx="10" cy="10" fill="none" stroke="#8B5CF6" class="r-node2" />
    <circle cx="10" cy="10" r="7" fill="#8B5CF6" filter="url(#glow)" />
    <circle cx="10" cy="10" r="3" fill="#FFFFFF" />

    <!-- Content Card -->
    <g transform="translate(35, -5)">
      <rect width="730" height="165" rx="10" fill="#0B1020" stroke="#1E293B" stroke-width="1" />
      <line x1="0" y1="0" x2="730" y2="0" stroke="url(#lineGrad)" stroke-width="2.5" filter="url(#glow)" />
      
      <!-- Top Title Row -->
      <text x="20" y="26" class="exp-title" fill="#C084FC">Fullstack Development Intern Program With NLP</text>
      <text x="365" y="26" class="org-text">— StudyOwl Education</text>
      
      <!-- Date Pill -->
      <rect x="575" y="10" width="140" height="24" rx="12" fill="#0F2942" stroke="#00F0FF" stroke-width="1" />
      <text x="587" y="26" class="date-text" fill="#00F0FF">Jun 2025 – Aug 2025</text>

      <!-- Project Subtitle -->
      <text x="20" y="48" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#C084FC">
        Project: AgriSahayak – AI-Based Multilingual Telegram Farming Assistant
      </text>

      <!-- Bullets matching resume -->
      <text x="20" y="72" class="bullet-text">
        • Developed a multilingual Telegram chatbot supporting 6 languages, using Node.js and the Telegram Bot API to provide
      </text>
      <text x="28" y="90" class="bullet-text">
        agriculture-related guidance through an interactive chat interface.
      </text>
      <text x="20" y="114" class="bullet-text">
        • Integrated the Groq API for AI-powered responses and the OpenWeather API for real-time location-based
      </text>
      <text x="28" y="132" class="bullet-text">
        weather updates, helping farmers make informed decisions.
      </text>

      <!-- Key Tech Tag -->
      <rect x="505" y="130" width="210" height="22" rx="4" fill="#1E1B4B" stroke="#8B5CF6" stroke-width="1" />
      <text x="515" y="145" class="metric-badge" fill="#C084FC">GROQ API // OPENWEATHER NLP</text>
    </g>
  </g>
</svg>
