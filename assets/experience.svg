<svg width="800" height="150" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Experience Timeline">
    <rect width="100%" height="100%" fill="#0D1117" rx="5"/>
    <g font-family="Arial, sans-serif">
        <line x1="250" y1="40" x2="250" y2="110" stroke="#30363d" stroke-width="2"/>
        <circle cx="250" cy="50" r="5" fill="#00F0FF">
            <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite"/>
        </circle>
        <circle cx="250" cy="100" r="4" fill="#30363d"/>
        
        <text x="210" y="54" font-size="12" font-weight="bold" fill="#c9d1d9" text-anchor="end">2026</text>
        
        <text x="270" y="50" font-size="14" font-weight="bold" fill="#00F0FF">IIT Tirupati</text>
        <text x="270" y="70" font-size="12" fill="#8b949e">AI Research Intern</text>
    </g>
</svg>
