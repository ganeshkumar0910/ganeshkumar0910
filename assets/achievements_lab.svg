<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 240" width="100%" height="100%">
  <defs>
    <linearGradient id="panelBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B16" />
      <stop offset="100%" stop-color="#040710" />
    </linearGradient>

    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#00F0FF" />
    </linearGradient>

    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes badgeFloat {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-3px); }
    }
    .section-title { font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 800; fill: #FFFFFF; font-size: 16px; letter-spacing: 2px; }
    .achieve-title { font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 700; fill: #E2E8F0; font-size: 13px; }
    .achieve-desc { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 11.5px; fill: #94A3B8; }
    .tag-cert { font-family: 'Courier New', monospace; font-size: 10px; font-weight: 700; fill: #00F0FF; }

    .b-float { animation: badgeFloat 3.5s ease-in-out infinite; }
  </style>

  <!-- Container Box -->
  <rect width="850" height="240" rx="14" fill="url(#panelBg)" stroke="#1E293B" stroke-width="1.5" />
  <rect width="850" height="240" rx="14" fill="none" stroke="#8B5CF6" stroke-width="1" stroke-opacity="0.3" filter="url(#glow)" />

  <!-- Section Header -->
  <g transform="translate(30, 22)">
    <circle cx="6" cy="6" r="4" fill="#8B5CF6" filter="url(#glow)" />
    <text x="20" y="10" class="section-title">ACHIEVEMENTS &amp; CERTIFICATIONS LAB</text>
    <line x1="0" y1="22" x2="790" y2="22" stroke="#1E293B" stroke-width="1" />
    <line x1="0" y1="22" x2="260" y2="22" stroke="url(#purpleGrad)" stroke-width="2.5" filter="url(#glow)" />
  </g>

  <!-- Grid of 4 Cards (2x2 Grid) -->
  <g transform="translate(30, 65)">
    <!-- Item 1: Certified in SQL -->
    <g transform="translate(0, 0)" class="b-float">
      <rect width="380" height="70" rx="8" fill="#0A1020" stroke="#1E293B" stroke-width="1" />
      <circle cx="20" cy="22" r="5" fill="#00F0FF" filter="url(#glow)" />
      <text x="35" y="26" class="achieve-title" fill="#00F0FF">Certified in SQL</text>
      <text x="35" y="48" class="achieve-desc">Competency in efficient queries, joins, subqueries &amp; analytics</text>
      <rect x="285" y="12" width="82" height="20" rx="10" fill="#06202A" stroke="#00F0FF" stroke-width="0.8" />
      <text x="295" y="26" class="tag-cert">SQL CERT</text>
    </g>

    <!-- Item 2: AWS Academy -->
    <g transform="translate(410, 0)" class="b-float" style="animation-delay: 0.5s;">
      <rect width="380" height="70" rx="8" fill="#0A1020" stroke="#1E293B" stroke-width="1" />
      <circle cx="20" cy="22" r="5" fill="#8B5CF6" filter="url(#glow)" />
      <text x="35" y="26" class="achieve-title" fill="#C084FC">AWS Academy Cloud Foundations</text>
      <text x="35" y="48" class="achieve-desc">AWS Training &amp; Cloud Computing Certification</text>
      <rect x="275" y="12" width="92" height="20" rx="10" fill="#1E1B4B" stroke="#8B5CF6" stroke-width="0.8" />
      <text x="285" y="26" class="tag-cert" fill="#C084FC">AWS CLOUD</text>
    </g>

    <!-- Item 3: AAPS Hackathon 2025 -->
    <g transform="translate(0, 82)" class="b-float" style="animation-delay: 1s;">
      <rect width="380" height="70" rx="8" fill="#0A1020" stroke="#1E293B" stroke-width="1" />
      <circle cx="20" cy="22" r="5" fill="#3B82F6" filter="url(#glow)" />
      <text x="35" y="26" class="achieve-title" fill="#38BDF8">AAPS Hackathon 2025</text>
      <text x="35" y="48" class="achieve-desc">Appreciation for outstanding performance held at MITS</text>
      <rect x="275" y="12" width="92" height="20" rx="10" fill="#0F2942" stroke="#38BDF8" stroke-width="0.8" />
      <text x="286" y="26" class="tag-cert" fill="#38BDF8">HACKATHON</text>
    </g>

    <!-- Item 4: Python for Data Science -->
    <g transform="translate(410, 82)" class="b-float" style="animation-delay: 1.5s;">
      <rect width="380" height="70" rx="8" fill="#0A1020" stroke="#1E293B" stroke-width="1" />
      <circle cx="20" cy="22" r="5" fill="#00F0FF" filter="url(#glow)" />
      <text x="35" y="26" class="achieve-title" fill="#00F0FF">Python for Data Science</text>
      <text x="35" y="48" class="achieve-desc">Reliance Foundation Skilling Academy (Feb 2025)</text>
      <rect x="275" y="12" width="92" height="20" rx="10" fill="#06202A" stroke="#00F0FF" stroke-width="0.8" />
      <text x="285" y="26" class="tag-cert">RELIANCE</text>
    </g>
  </g>
</svg>
