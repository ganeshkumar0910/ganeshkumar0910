<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 260" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814" />
      <stop offset="50%" stop-color="#0C122A" />
      <stop offset="100%" stop-color="#040612" />
    </linearGradient>

    <linearGradient id="cyanBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <linearGradient id="barGrad3D" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.2" />
    </linearGradient>

    <filter id="ultraGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes barScale1 {
      0%, 100% { transform: scaleY(0.7); }
      50% { transform: scaleY(1.4); }
    }
    @keyframes barScale2 {
      0%, 100% { transform: scaleY(1.3); }
      50% { transform: scaleY(0.6); }
    }
    @keyframes waveDash {
      0% { stroke-dashoffset: 400; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes badgeGlow {
      0%, 100% { opacity: 0.8; filter: drop-shadow(0 0 4px #00F0FF); }
      50% { opacity: 1; filter: drop-shadow(0 0 12px #00F0FF); }
    }

    .proj-title { font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 900; fill: #00F0FF; font-size: 15.5px; letter-spacing: 0.5px; }
    .subtitle { font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 600; fill: #E2E8F0; font-size: 13px; }
    .bullet-text { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 12px; fill: #94A3B8; line-height: 1.5; }
    .tech-pill { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 11px; font-weight: 600; fill: #7DD3FC; }
    .acc-badge { font-family: 'Courier New', monospace; font-size: 11px; font-weight: 700; fill: #00F0FF; }

    .b1 { animation: barScale1 2s ease-in-out infinite; transform-origin: bottom; }
    .b2 { animation: barScale2 2.6s ease-in-out infinite 0.4s; transform-origin: bottom; }
    .b3 { animation: barScale1 2.2s ease-in-out infinite 0.8s; transform-origin: bottom; }
    .b4 { animation: barScale2 3s ease-in-out infinite 1.2s; transform-origin: bottom; }

    .wave-line { stroke-dasharray: 8 4; animation: waveDash 4s linear infinite; }
    .g-badge { animation: badgeGlow 2.5s ease-in-out infinite; }
  </style>

  <!-- Card Base Background -->
  <rect width="842" height="252" rx="14" fill="url(#cardBg)" stroke="#1E293B" stroke-width="1.5" />
  <rect width="842" height="252" rx="14" fill="none" stroke="#00F0FF" stroke-width="1" stroke-opacity="0.35" filter="url(#ultraGlow)" />
  
  <!-- Left Glowing Accent Bar -->
  <rect x="0" y="0" width="5" height="252" rx="2" fill="url(#cyanBlue)" filter="url(#ultraGlow)" />

  <!-- DYNAMIC 3D ISOMETRIC BAR CHART & WAVEFORM GRAPH (BACKGROUND RIGHT VISUAL) -->
  <g transform="translate(600, 110) skewY(-15) rotate(10)" opacity="0.5">
    <!-- Animated Wave overlay -->
    <path d="M -20 -10 Q 30 -60, 80 -10 T 180 -20" fill="none" stroke="#00F0FF" stroke-width="2" class="wave-line" filter="url(#ultraGlow)" />

    <!-- 3D Scaling Bars -->
    <rect x="0" y="-30" width="14" height="60" fill="url(#barGrad3D)" stroke="#00F0FF" stroke-width="1" class="b1" />
    <rect x="22" y="-50" width="14" height="80" fill="url(#barGrad3D)" stroke="#00F0FF" stroke-width="1" class="b2" />
    <rect x="44" y="-20" width="14" height="50" fill="url(#barGrad3D)" stroke="#00F0FF" stroke-width="1" class="b3" />
    <rect x="66" y="-60" width="14" height="90" fill="url(#barGrad3D)" stroke="#00F0FF" stroke-width="1" class="b4" />
    <rect x="88" y="-40" width="14" height="70" fill="url(#barGrad3D)" stroke="#00F0FF" stroke-width="1" class="b1" />
    <rect x="110" y="-70" width="14" height="100" fill="url(#barGrad3D)" stroke="#00F0FF" stroke-width="1" class="b2" />

    <line x1="-10" y1="30" x2="140" y2="30" stroke="#00F0FF" stroke-width="1.5" />
    <text x="-10" y="45" font-family="monospace" font-size="9" fill="#00F0FF">3D LSTM PREDICTIVE MATRIX</text>
  </g>

  <g transform="translate(30, 22)">
    <!-- Top Header -->
    <g transform="translate(0, 0)">
      <circle cx="6" cy="6" r="4.5" fill="#00F0FF" class="g-badge" filter="url(#ultraGlow)" />
      <text x="20" y="10" class="proj-title">Multi-Horizon Power Consumption Forecasting</text>
      <text x="395" y="10" class="subtitle">using Deep Learning</text>
      
      <!-- Accuracy / Model Tag -->
      <rect x="575" y="-5" width="215" height="26" rx="13" fill="#06202A" stroke="#00F0FF" stroke-width="1" class="g-badge" />
      <text x="587" y="12" class="acc-badge">LSTM // STREAMLIT 3D FORECAST</text>
    </g>

    <!-- Glowing Separator -->
    <line x1="0" y1="24" x2="790" y2="24" stroke="#1E293B" stroke-width="1" />
    <line x1="0" y1="24" x2="380" y2="24" stroke="url(#cyanBlue)" stroke-width="2.5" filter="url(#ultraGlow)" />

    <!-- Project Description Bullets matching resume -->
    <text x="0" y="52" class="bullet-text">
      • Developed an LSTM-based deep learning model to forecast power consumption across multiple time horizons
    </text>
    <text x="12" y="70" class="bullet-text">
      (Hour, Day, Week, Month).
    </text>
    
    <text x="0" y="94" class="bullet-text">
      • Performed data preprocessing, feature engineering, sequence generation, and model training using Python, TensorFlow,
    </text>
    <text x="12" y="112" class="bullet-text">
      Pandas, and Scikit-learn.
    </text>

    <text x="0" y="136" class="bullet-text">
      • Built a Streamlit web application for real-time power consumption forecasting with CSV input, interactive visualizations,
    </text>
    <text x="12" y="154" class="bullet-text">
      and prediction reports.
    </text>

    <!-- Technologies Row matching resume -->
    <g transform="translate(0, 185)">
      <text x="0" y="15" font-family="monospace" font-size="11" fill="#64748B">TECHNOLOGIES:</text>
      
      <g transform="translate(100, 0)">
        <rect x="0" y="0" width="55" height="22" rx="4" fill="#0F2942" stroke="#00F0FF" stroke-width="0.6" />
        <text x="8" y="15" class="tech-pill">Python</text>

        <rect x="63" y="0" width="115" height="22" rx="4" fill="#0F2942" stroke="#00F0FF" stroke-width="0.6" />
        <text x="71" y="15" class="tech-pill">TensorFlow/Keras</text>

        <rect x="186" y="0" width="48" height="22" rx="4" fill="#0F2942" stroke="#00F0FF" stroke-width="0.6" />
        <text x="194" y="15" class="tech-pill">LSTM</text>

        <rect x="242" y="0" width="70" height="22" rx="4" fill="#0F2942" stroke="#00F0FF" stroke-width="0.6" />
        <text x="250" y="15" class="tech-pill">Streamlit</text>

        <rect x="320" y="0" width="58" height="22" rx="4" fill="#0F2942" stroke="#00F0FF" stroke-width="0.6" />
        <text x="328" y="15" class="tech-pill">Pandas</text>

        <rect x="386" y="0" width="58" height="22" rx="4" fill="#0F2942" stroke="#00F0FF" stroke-width="0.6" />
        <text x="394" y="15" class="tech-pill">NumPy</text>

        <rect x="452" y="0" width="80" height="22" rx="4" fill="#0F2942" stroke="#00F0FF" stroke-width="0.6" />
        <text x="460" y="15" class="tech-pill">Scikit-learn</text>

        <rect x="540" y="0" width="70" height="22" rx="4" fill="#0F2942" stroke="#00F0FF" stroke-width="0.6" />
        <text x="548" y="15" class="tech-pill">Matplotlib</text>

        <rect x="618" y="0" width="50" height="22" rx="4" fill="#0F2942" stroke="#00F0FF" stroke-width="0.6" />
        <text x="626" y="15" class="tech-pill">Plotly</text>
      </g>
    </g>
  </g>
</svg>
