<svg width="800" height="250" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AI Skill Architecture">
    <rect width="100%" height="100%" fill="#0D1117" rx="5"/>
    <g transform="translate(400, 125)">
        <circle cx="0" cy="0" r="30" fill="#161b22" stroke="#00F0FF" stroke-width="2">
            <animate attributeName="stroke-width" values="2;4;2" dur="2s" repeatCount="indefinite"/>
        </circle>
        <text x="0" y="5" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#00F0FF" text-anchor="middle">AI</text>
        
        <g stroke="#30363d" stroke-width="2">
            <line x1="0" y1="-30" x2="-100" y2="-80"/>
            <line x1="0" y1="-30" x2="100" y2="-80"/>
            <line x1="-30" y1="0" x2="-150" y2="0"/>
            <line x1="30" y1="0" x2="150" y2="0"/>
            <line x1="0" y1="30" x2="-100" y2="80"/>
            <line x1="0" y1="30" x2="100" y2="80"/>
        </g>
        
        <g font-family="Arial, sans-serif" font-size="12" fill="#c9d1d9" text-anchor="middle">
            <rect x="-160" y="-100" width="120" height="25" fill="#161b22" stroke="#B900FF" rx="4"/>
            <text x="-100" y="-83">Machine Learning</text>
            
            <rect x="40" y="-100" width="120" height="25" fill="#161b22" stroke="#B900FF" rx="4"/>
            <text x="100" y="-83">Deep Learning</text>
            
            <rect x="-210" y="-12" width="120" height="25" fill="#161b22" stroke="#B900FF" rx="4"/>
            <text x="-150" y="5">Computer Vision</text>
            
            <rect x="90" y="-12" width="120" height="25" fill="#161b22" stroke="#B900FF" rx="4"/>
            <text x="150" y="5">NLP</text>
            
            <rect x="-160" y="70" width="120" height="25" fill="#161b22" stroke="#B900FF" rx="4"/>
            <text x="-100" y="87">OCR</text>
            
            <rect x="40" y="70" width="120" height="25" fill="#161b22" stroke="#B900FF" rx="4"/>
            <text x="100" y="87">Explainable AI</text>
        </g>
        
        <circle r="3" fill="#ffffff">
            <animateMotion path="M 0 -30 L -100 -80" dur="1.5s" repeatCount="indefinite"/>
        </circle>
        <circle r="3" fill="#ffffff">
            <animateMotion path="M 0 -30 L 100 -80" dur="1.8s" repeatCount="indefinite"/>
        </circle>
        <circle r="3" fill="#ffffff">
            <animateMotion path="M -30 0 L -150 0" dur="1.2s" repeatCount="indefinite"/>
        </circle>
    </g>
</svg>
