<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 230" width="100%" height="100%">
  <defs>
    <linearGradient id="panelBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C16" />
      <stop offset="100%" stop-color="#04070F" />
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes scorePulse {
      0%, 100% { opacity: 0.85; filter: drop-shadow(0 0 5px #00F0FF); }
      50% { opacity: 1; filter: drop-shadow(0 0 14px #00F0FF); }
    }
    .section-title { font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 800; fill: #FFFFFF; font-size: 16px; letter-spacing: 2px; }
    .degree-title { font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 800; fill: #00F0FF; font-size: 14px; }
    .inst-text { font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 500; fill: #CBD5E1; font-size: 12.5px; }
    .year-text { font-family: 'Courier New', monospace; font-size: 12px; fill: #94A3B8; font-weight: 600; }
    .score-badge { font-family: 'Courier New', monospace; font-size: 12px; font-weight: 800; fill: #00F0FF; }

    .pulse-score { animation: scorePulse 2.5s ease-in-out infinite; }
  </style>

  <!-- Container Box -->
  <rect width="850" height="230" rx="14" fill="url(#panelBg)" stroke="#1E293B" stroke-width="1.5" />
  <rect width="850" height="230" rx="14" fill="none" stroke="#00F0FF" stroke-width="1" stroke-opacity="0.3" filter="url(#glow)" />

  <!-- Section Header -->
  <g transform="translate(30, 22)">
    <circle cx="6" cy="6" r="4.5" fill="#00F0FF" filter="url(#glow)" />
    <text x="20" y="10" class="section-title">EDUCATION MATRIX // ACADEMIC RECORD</text>
    <line x1="0" y1="22" x2="790" y2="22" stroke="#1E293B" stroke-width="1" />
    <line x1="0" y1="22" x2="230" y2="22" stroke="url(#cyanGrad)" stroke-width="2.5" filter="url(#glow)" />
  </g>

  <!-- 2 Row Matrix Cards with Ample Padding -->
  <g transform="translate(30, 65)">
    <!-- Row 1: B.Tech -->
    <g transform="translate(0, 0)">
      <rect width="790" height="68" rx="8" fill="#0B1224" stroke="#1E293B" stroke-width="1" />
      <circle cx="20" cy="34" r="4" fill="#00F0FF" filter="url(#glow)" />
      
      <text x="35" y="28" class="degree-title">B.Tech – Computer Science and Engineering (Artificial Intelligence)</text>
      <text x="35" y="50" class="inst-text">Madanapalle Institute of Technology &amp; Science, Andhra Pradesh</text>
      
      <text x="540" y="39" class="year-text">2023 – 2027</text>

      <rect x="640" y="21" width="135" height="26" rx="13" fill="#06202A" stroke="#00F0FF" stroke-width="1.2" class="pulse-score" />
      <text x="653" y="38" class="score-badge">CGPA: 8.95 / 10</text>
    </g>

    <!-- Row 2: Intermediate MPC -->
    <g transform="translate(0, 80)">
      <rect width="790" height="68" rx="8" fill="#0B1224" stroke="#1E293B" stroke-width="1" />
      <circle cx="20" cy="34" r="4" fill="#8B5CF6" filter="url(#glow)" />
      
      <text x="35" y="28" class="degree-title" fill="#C084FC">Intermediate (MPC)</text>
      <text x="35" y="50" class="inst-text">Sri Krishna Reddy Siddhartha Junior College, Madanapalle</text>
      
      <text x="540" y="39" class="year-text">2021 – 2023</text>

      <rect x="640" y="21" width="135" height="26" rx="13" fill="#1E1B4B" stroke="#8B5CF6" stroke-width="1.2" class="pulse-score" style="animation-delay: 1.25s;" />
      <text x="657" y="38" class="score-badge" fill="#C084FC">MARKS: 91.2%</text>
    </g>
  </g>
</svg>
