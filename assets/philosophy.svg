<svg width="800" height="200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Development Philosophy">
    <rect width="100%" height="100%" fill="#0D1117" rx="5"/>
    <g font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#00F0FF">
        <circle cx="200" cy="100" r="40" fill="#161b22" stroke="#00F0FF" stroke-width="2"/>
        <text x="200" y="105" text-anchor="middle">LEARN</text>
        
        <line x1="240" y1="100" x2="300" y2="100" stroke="#30363d" stroke-width="2"/>
        <path d="M 290 95 L 300 100 L 290 105" fill="#30363d"/>
        
        <circle cx="340" cy="100" r="40" fill="#161b22" stroke="#B900FF" stroke-width="2"/>
        <text x="340" y="105" text-anchor="middle" fill="#B900FF">BUILD</text>
        
        <line x1="380" y1="100" x2="440" y2="100" stroke="#30363d" stroke-width="2"/>
        <path d="M 430 95 L 440 100 L 430 105" fill="#30363d"/>
        
        <circle cx="480" cy="100" r="40" fill="#161b22" stroke="#00F0FF" stroke-width="2"/>
        <text x="480" y="105" text-anchor="middle">TEST</text>
        
        <line x1="520" y1="100" x2="580" y2="100" stroke="#30363d" stroke-width="2"/>
        <path d="M 570 95 L 580 100 L 570 105" fill="#30363d"/>
        
        <circle cx="620" cy="100" r="40" fill="#161b22" stroke="#B900FF" stroke-width="2"/>
        <text x="620" y="105" text-anchor="middle" fill="#B900FF">IMPROVE</text>
        
        <!-- Loop back -->
        <path d="M 620 60 Q 410 -20 200 60" fill="none" stroke="#30363d" stroke-width="2" stroke-dasharray="4 4"/>
        <path d="M 210 50 L 200 60 L 210 70" fill="none" stroke="#30363d" stroke-width="2"/>
        
        <circle r="3" fill="#ffffff">
            <animateMotion path="M 620 60 Q 410 -20 200 60" dur="3s" repeatCount="indefinite"/>
        </circle>
    </g>
</svg>
