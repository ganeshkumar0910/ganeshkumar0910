<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 150" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040711" />
      <stop offset="100%" stop-color="#090E1D" />
    </linearGradient>

    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#00F0FF" />
    </linearGradient>

    <filter id="ultraGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes spinOrbOuter {
      0% { transform: scale(1) rotate(0deg); opacity: 0.8; }
      50% { transform: scale(1.3) rotate(180deg); opacity: 1; }
      100% { transform: scale(1) rotate(360deg); opacity: 0.8; }
    }
    @keyframes spinOrbInner {
      0% { transform: rotate(360deg); }
      100% { transform: rotate(0deg); }
    }
    @keyframes laserDash {
      0% { stroke-dashoffset: 80; }
      100% { stroke-dashoffset: 0; }
    }

    .orb-outer { animation: spinOrbOuter 4s ease-in-out infinite; transform-origin: 425px 48px; }
    .orb-inner { animation: spinOrbInner 3s linear infinite; transform-origin: 425px 48px; }
    .laser-beam { stroke-dasharray: 8 4; animation: laserDash 2s linear infinite; }

    .footer-text { font-family: 'Courier New', monospace; font-weight: 800; fill: #00F0FF; font-size: 13.5px; letter-spacing: 3px; }
    .sub-footer { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 12px; fill: #64748B; letter-spacing: 1.5px; font-weight: 600; }
  </style>

  <!-- Background Card -->
  <rect width="850" height="150" rx="14" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="1.5" />
  <rect width="850" height="150" rx="14" fill="none" stroke="#00F0FF" stroke-width="1" stroke-opacity="0.3" filter="url(#ultraGlow)" />

  <!-- Converging Neural Network -->
  <g opacity="0.85">
    <path d="M 80 15 L 425 48" stroke="#1E293B" stroke-width="1.5" />
    <path d="M 180 85 L 425 48" stroke="#1E293B" stroke-width="1.5" />
    <path d="M 40 85 L 425 48" stroke="url(#pulseGrad)" stroke-width="2.5" class="laser-beam" filter="url(#ultraGlow)" />
    
    <path d="M 770 15 L 425 48" stroke="#1E293B" stroke-width="1.5" />
    <path d="M 670 85 L 425 48" stroke="#1E293B" stroke-width="1.5" />
    <path d="M 810 85 L 425 48" stroke="url(#pulseGrad)" stroke-width="2.5" class="laser-beam" filter="url(#ultraGlow)" />

    <circle cx="80" cy="15" r="4" fill="#8B5CF6" />
    <circle cx="180" cy="85" r="3.5" fill="#00F0FF" />
    <circle cx="770" cy="15" r="4" fill="#8B5CF6" />
    <circle cx="670" cy="85" r="3.5" fill="#00F0FF" />

    <!-- 3D Dual Counter-Rotating Central Core Orb -->
    <polygon points="425,30 443,48 425,66 407,48" fill="none" stroke="#00F0FF" stroke-width="1.5" class="orb-outer" filter="url(#ultraGlow)" />
    <polygon points="425,34 439,48 425,62 411,48" fill="none" stroke="#8B5CF6" stroke-width="1.5" class="orb-inner" />
    <circle cx="425" cy="48" r="6" fill="#00F0FF" filter="url(#ultraGlow)" />
  </g>

  <!-- Footer Terminal Text -->
  <g transform="translate(425, 105)" text-anchor="middle">
    <text x="0" y="0" class="footer-text" filter="url(#ultraGlow)">
      SYSTEM READY &#x2192; BUILD &#x2192; INNOVATE &#x2192; DEPLOY
    </text>
    <text x="0" y="22" class="sub-footer">
      THUGU GANESH KUMAR REDDY // ULTRA 3D AI RESEARCH &amp; FULLSTACK LAB
    </text>
  </g>
</svg>
