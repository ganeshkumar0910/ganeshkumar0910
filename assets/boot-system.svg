<svg width="800" height="200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="System Boot Sequence">
    <rect width="100%" height="100%" fill="#0D1117" rx="5" stroke="#30363d" stroke-width="1"/>
    <rect x="10" y="10" width="780" height="25" fill="#161b22"/>
    <text x="20" y="27" font-family="Courier New, monospace" font-size="12" fill="#c9d1d9" font-weight="bold">AI.DEVELOPER.SYSTEM // BOOT SEQUENCE</text>
    
    <g font-family="Courier New, monospace" font-size="14" fill="#00F0FF">
        <text x="20" y="70">INITIALIZING INTERFACE ............. 100%</text>
        <text x="20" y="95">LOADING AI MODULES ................. OK</text>
        <text x="20" y="120">LOADING COMPUTER VISION ............ OK</text>
        <text x="20" y="145">LOADING FRONT-END SYSTEM ........... OK</text>
        <text x="20" y="170">LOADING PROJECT DATABASE ........... OK</text>
        <text x="20" y="170" fill="#B900FF" opacity="0">
            <animate attributeName="opacity" values="0;1" dur="2s" begin="0.5s" fill="freeze"/>
        </text>
    </g>
    
    <!-- Blinking Cursor -->
    <rect x="360" y="158" width="10" height="15" fill="#00F0FF">
        <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
</svg>
