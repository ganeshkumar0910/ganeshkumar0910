<svg width="800" height="380" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AI to UX Architecture">
    <rect width="100%" height="100%" fill="#0D1117" rx="5"/>
    <g font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">
        
        <rect x="300" y="30" width="200" height="35" fill="#161b22" stroke="#B900FF" rx="5"/>
        <text x="400" y="52" fill="#c9d1d9">ARTIFICIAL INTELLIGENCE</text>
        
        <rect x="300" y="90" width="200" height="35" fill="#161b22" stroke="#B900FF" rx="5"/>
        <text x="400" y="112" fill="#c9d1d9">MACHINE LEARNING</text>

        <rect x="300" y="150" width="200" height="35" fill="#161b22" stroke="#B900FF" rx="5"/>
        <text x="400" y="172" fill="#c9d1d9">COMPUTER VISION</text>

        <rect x="300" y="210" width="200" height="35" fill="#161b22" stroke="#30363d" rx="5"/>
        <text x="400" y="232" fill="#c9d1d9">APPLICATION</text>

        <rect x="300" y="270" width="200" height="35" fill="#161b22" stroke="#00F0FF" rx="5"/>
        <text x="400" y="292" fill="#c9d1d9">FRONT-END</text>

        <rect x="300" y="330" width="200" height="35" fill="#161b22" stroke="#00F0FF" rx="5"/>
        <text x="400" y="352" fill="#00F0FF">USER EXPERIENCE</text>

        <!-- Connecting lines -->
        <g stroke="#30363d" stroke-width="2">
            <line x1="400" y1="65" x2="400" y2="90"/>
            <line x1="400" y1="125" x2="400" y2="150"/>
            <line x1="400" y1="185" x2="400" y2="210"/>
            <line x1="400" y1="245" x2="400" y2="270"/>
            <line x1="400" y1="305" x2="400" y2="330"/>
        </g>
        
        <!-- Animated Particles -->
        <circle r="3" fill="#ffffff">
            <animateMotion path="M 400 65 L 400 90" dur="1s" repeatCount="indefinite"/>
        </circle>
        <circle r="3" fill="#ffffff">
            <animateMotion path="M 400 125 L 400 150" dur="1s" repeatCount="indefinite"/>
        </circle>
        <circle r="3" fill="#ffffff">
            <animateMotion path="M 400 185 L 400 210" dur="1s" repeatCount="indefinite"/>
        </circle>
        <circle r="3" fill="#ffffff">
            <animateMotion path="M 400 245 L 400 270" dur="1s" repeatCount="indefinite"/>
        </circle>
        <circle r="3" fill="#ffffff">
            <animateMotion path="M 400 305 L 400 330" dur="1s" repeatCount="indefinite"/>
        </circle>
    </g>
</svg>
