<svg width="390" height="80" xmlns="http://www.w3.org/2000/svg">
    <rect width="100%" height="100%" fill="#0D1117" rx="5"/>
    <g transform="translate(20, 45)" font-family="Courier New, monospace" font-size="10" font-weight="bold" fill="#B900FF">
        <text x="0" y="0">DOCUMENT</text>
        <line x1="60" y1="-3" x2="90" y2="-3" stroke="#30363d" stroke-width="1.5"/>
        <circle r="2" fill="#ffffff">
            <animateMotion path="M 60 -3 L 90 -3" dur="1.5s" repeatCount="indefinite"/>
        </circle>
        
        <text x="100" y="0" fill="#c9d1d9">STYLE</text>
        <line x1="140" y1="-3" x2="170" y2="-3" stroke="#30363d" stroke-width="1.5"/>
        <circle r="2" fill="#ffffff">
            <animateMotion path="M 140 -3 L 170 -3" dur="1.5s" repeatCount="indefinite"/>
        </circle>

        <text x="180" y="0" fill="#c9d1d9">AUGMENTATION</text>
        <line x1="265" y1="-3" x2="295" y2="-3" stroke="#30363d" stroke-width="1.5"/>
        <circle r="2" fill="#ffffff">
            <animateMotion path="M 265 -3 L 295 -3" dur="1.5s" repeatCount="indefinite"/>
        </circle>

        <text x="305" y="0" fill="#00F0FF">OCR DATA</text>
    </g>
</svg>
