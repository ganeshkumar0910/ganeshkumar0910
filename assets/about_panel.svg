<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 200" width="100%" height="100%">
  <defs>
    <linearGradient id="panelBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B16" />
      <stop offset="50%" stop-color="#0D1328" />
      <stop offset="100%" stop-color="#040710" />
    </linearGradient>

    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes holographicScan {
      0% { transform: translateY(-10px); opacity: 0; }
      50% { opacity: 0.4; }
      100% { transform: translateY(200px); opacity: 0; }
    }
    .header-title { font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 800; fill: #00F0FF; font-size: 14px; letter-spacing: 2px; }
    .summary-text { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13.5px; fill: #E2E8F0; line-height: 1.7; font-weight: 400; }
    .scan-line { animation: holographicScan 3.5s ease-in-out infinite; }
  </style>

  <!-- Container Box -->
  <rect width="842" height="192" rx="12" fill="url(#panelBg)" stroke="#1E293B" stroke-width="1.5" />
  <rect width="842" height="192" rx="12" fill="none" stroke="#00F0FF" stroke-width="1" stroke-opacity="0.3" filter="url(#glow)" />
  
  <!-- Holographic Scan Light -->
  <line x1="0" y1="0" x2="842" y2="0" stroke="#00F0FF" stroke-width="1.5" class="scan-line" filter="url(#glow)" />

  <!-- Left Accent Bar -->
  <rect x="0" y="0" width="5" height="192" rx="2" fill="url(#accentGlow)" filter="url(#glow)" />

  <!-- Content Group -->
  <g transform="translate(32, 26)">
    <!-- Header Indicator -->
    <g transform="translate(0, 0)">
      <circle cx="6" cy="6" r="4.5" fill="#00F0FF" filter="url(#glow)" />
      <text x="22" y="10" class="header-title">CAREER OBJECTIVE // PROFILE OVERVIEW</text>
    </g>

    <!-- Glowing Separator -->
    <line x1="0" y1="24" x2="780" y2="24" stroke="#1E293B" stroke-width="1" />
    <line x1="0" y1="24" x2="200" y2="24" stroke="url(#accentGlow)" stroke-width="2" filter="url(#glow)" />

    <!-- Professional Career Objective Text Lines matching resume -->
    <text x="0" y="56" class="summary-text">
      "Driven Computer Science (Artificial Intelligence) undergraduate with hands-on experience in software development,
    </text>
    <text x="0" y="80" class="summary-text">
      AI-powered applications, and full-stack technologies. Proficient in Python, Java, Data Structures &amp; Algorithms, DBMS,
    </text>
    <text x="0" y="104" class="summary-text">
      and OOP, with a passion for designing efficient, scalable, and user-focused solutions. Eager to contribute technical expertise,
    </text>
    <text x="0" y="128" class="summary-text">
      analytical thinking, and a continuous learning mindset to a dynamic software engineering team."
    </text>
  </g>

  <!-- Corner Brackets -->
  <path d="M 810 170 L 825 170 L 825 155" stroke="#00F0FF" stroke-width="1.5" fill="none" opacity="0.6" filter="url(#glow)" />
</svg>
