<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#02040B" />
      <stop offset="50%" stop-color="#080D20" />
      <stop offset="100%" stop-color="#030511" />
    </linearGradient>

    <!-- Wave Electric Blue to Violet Gradient -->
    <linearGradient id="waveGlowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0" />
      <stop offset="30%" stop-color="#00F0FF" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#8B5CF6" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <!-- Ultra Glow Filters -->
    <filter id="waveGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur1" />
      <feGaussianBlur stdDeviation="14" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    /* Neural Thought Wave Propagating Keyframes */
    @keyframes thoughtWaveMove {
      0% { transform: translateX(-400px); }
      100% { transform: translateX(850px); }
    }
    
    /* Sequential Node Activation along X-Axis */
    @keyframes nodeLight1 {
      0%, 100% { fill: #1E293B; stroke: #334155; filter: none; }
      20%, 35% { fill: #00F0FF; stroke: #FFFFFF; filter: drop-shadow(0 0 10px #00F0FF); }
    }
    @keyframes nodeLight2 {
      0%, 100% { fill: #1E293B; stroke: #334155; filter: none; }
      40%, 55% { fill: #8B5CF6; stroke: #FFFFFF; filter: drop-shadow(0 0 12px #8B5CF6); }
    }
    @keyframes nodeLight3 {
      0%, 100% { fill: #1E293B; stroke: #334155; filter: none; }
      60%, 75% { fill: #00F0FF; stroke: #FFFFFF; filter: drop-shadow(0 0 14px #00F0FF); }
    }

    @keyframes textShimmer {
      0%, 100% { fill: #00F0FF; filter: drop-shadow(0 0 6px #00F0FF); }
      50% { fill: #C084FC; filter: drop-shadow(0 0 14px #8B5CF6); }
    }
    @keyframes borderLaser {
      0% { stroke-dashoffset: 1000; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes blinkFast {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.2; }
    }

    .title-animated { font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 900; animation: textShimmer 4s ease-in-out infinite; letter-spacing: 1px; }
    .sub-text { font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 600; fill: #E2E8F0; letter-spacing: 0.5px; }
    .meta-text { font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 600; fill: #38BDF8; font-size: 12.5px; }
    .tag-text { font-family: 'Courier New', monospace; font-weight: 700; fill: #00F0FF; font-size: 11px; }

    .thought-wave-path { animation: thoughtWaveMove 6s linear infinite; }
    .n-act1 { animation: nodeLight1 6s ease-in-out infinite; }
    .n-act2 { animation: nodeLight2 6s ease-in-out infinite; }
    .n-act3 { animation: nodeLight3 6s ease-in-out infinite; }

    .laser-border { stroke-dasharray: 200 800; animation: borderLaser 6s linear infinite; }
    .blink { animation: blinkFast 1.2s ease-in-out infinite; }
  </style>

  <!-- Base Card Background -->
  <rect width="850" height="360" rx="16" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="1.5" />

  <!-- BACKGROUND NEURAL NETWORK MESH (RIGHT SIDE VISUAL) -->
  <g opacity="0.75" transform="translate(480, 40)">
    <!-- Base Structural Axon Paths -->
    <path d="M 50 60 L 120 120 L 220 80 L 300 140" stroke="#1E293B" stroke-width="1.5" fill="none" />
    <path d="M 120 120 L 160 220 L 260 180 L 320 250" stroke="#1E293B" stroke-width="1.5" fill="none" />
    <path d="M 50 180 L 160 220 L 220 80 L 320 110" stroke="#1E293B" stroke-width="1.5" fill="none" />
    <path d="M 220 80 L 260 180 L 300 140" stroke="#1E293B" stroke-width="1.5" fill="none" />

    <!-- Neural Nodes with Wave Activation Timings -->
    <circle cx="50" cy="60" r="6" class="n-act1" />
    <circle cx="50" cy="180" r="6" class="n-act1" style="animation-delay: 0.3s;" />
    
    <circle cx="120" cy="120" r="8" class="n-act2" />
    <circle cx="160" cy="220" r="7" class="n-act2" style="animation-delay: 0.5s;" />

    <circle cx="220" cy="80" r="9" class="n-act3" />
    <circle cx="260" cy="180" r="8" class="n-act3" style="animation-delay: 0.4s;" />

    <circle cx="300" cy="140" r="7" class="n-act3" style="animation-delay: 0.8s;" />
    <circle cx="320" cy="110" r="6" class="n-act3" style="animation-delay: 1s;" />
    <circle cx="320" cy="250" r="6" class="n-act3" style="animation-delay: 1.2s;" />
  </g>

  <!-- 🧠 CONTINUOUS SINUSOIDAL NEURAL THOUGHT WAVE PROPAGATION -->
  <g filter="url(#waveGlow)">
    <path class="thought-wave-path" d="M -400 160 Q -300 80, -200 160 T 0 160 T 200 160 T 400 160 T 600 160 T 800 160" fill="none" stroke="url(#waveGlowGrad)" stroke-width="4" stroke-linecap="round">
      <animate attributeName="d" 
               values="M -400 160 Q -300 80, -200 160 T 0 160 T 200 160 T 400 160 T 600 160 T 800 160;
                       M -400 160 Q -300 240, -200 160 T 0 160 T 200 160 T 400 160 T 600 160 T 800 160;
                       M -400 160 Q -300 80, -200 160 T 0 160 T 200 160 T 400 160 T 600 160 T 800 160" 
               dur="4s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- Glowing Perimeter Laser Line -->
  <rect width="850" height="360" rx="16" fill="none" stroke="url(#cyberGrad)" stroke-width="2.5" class="laser-border" filter="url(#waveGlow)" />

  <!-- LEFT HERO INTERFACE CONTENT -->
  <g transform="translate(45, 42)">
    <!-- Top System Online Tag -->
    <g transform="translate(0, 0)">
      <rect width="255" height="26" rx="13" fill="#0B172A" stroke="#00F0FF" stroke-width="1.2" opacity="0.95" />
      <circle cx="15" cy="13" r="4.5" fill="#00F0FF" class="blink" filter="url(#waveGlow)" />
      <text x="28" y="17" class="tag-text">🧠 NEURAL THOUGHT WAVE // ONLINE</text>
    </g>

    <!-- Candidate Name -->
    <g transform="translate(0, 65)">
      <text x="2" y="2" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="28" fill="#000000" opacity="0.8">
        THUGU GANESH KUMAR REDDY
      </text>
      <text x="0" y="0" class="title-animated" font-size="28">
        THUGU GANESH KUMAR REDDY
      </text>
    </g>

    <!-- Location & Clean Text Metadata Badges -->
    <g transform="translate(0, 85)">
      <rect width="180" height="22" rx="4" fill="#0F2942" stroke="#00F0FF" stroke-width="0.8" />
      <text x="10" y="15" class="meta-text">Madanapalle, AP, India</text>

      <rect x="190" y="0" width="160" height="22" rx="4" fill="#1E1B4B" stroke="#8B5CF6" stroke-width="0.8" />
      <text x="200" y="15" class="meta-text" fill="#C084FC">ganeshkumar0910</text>
    </g>

    <!-- Subtitle / Positioning Statement -->
    <text x="0" y="134" class="sub-text" font-size="14">
      Computer Science (AI) Undergraduate | AI Applications &amp; Full-Stack Systems
    </text>

    <!-- Core Skill Pills -->
    <g transform="translate(0, 158)">
      <g transform="translate(0, 0)">
        <rect width="145" height="28" rx="6" fill="#1E1B4B" stroke="#8B5CF6" stroke-width="1.2" filter="url(#softGlow)" />
        <text x="14" y="18" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#C084FC">ML &amp; Deep Learning</text>
      </g>

      <g transform="translate(155, 0)">
        <rect width="165" height="28" rx="6" fill="#0F172A" stroke="#00F0FF" stroke-width="1.2" filter="url(#softGlow)" />
        <text x="14" y="18" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#38BDF8">Computer Vision &amp; OCR</text>
      </g>

      <g transform="translate(330, 0)">
        <rect width="165" height="28" rx="6" fill="#06202A" stroke="#06B6D4" stroke-width="1.2" filter="url(#softGlow)" />
        <text x="14" y="18" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#22D3EE">Full-Stack Web Systems</text>
      </g>
    </g>

    <!-- Quick Status / Metrics Row -->
    <g transform="translate(0, 225)">
      <line x1="0" y1="0" x2="495" y2="0" stroke="#1E293B" stroke-width="1.5" />
      <line x1="0" y1="0" x2="220" y2="0" stroke="url(#cyberGrad)" stroke-width="2.5" filter="url(#waveGlow)" />
      
      <g transform="translate(0, 16)">
        <text x="0" y="12" font-family="monospace" font-size="11" fill="#64748B">INSTITUTE:</text>
        <text x="75" y="12" font-family="'Segoe UI', sans-serif" font-size="12.5" font-weight="600" fill="#CBD5E1">MITS (B.Tech CSE - AI)</text>
      </g>
      <g transform="translate(280, 16)">
        <text x="0" y="12" font-family="monospace" font-size="11" fill="#64748B">CGPA:</text>
        <text x="45" y="12" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="800" fill="#00F0FF" filter="url(#waveGlow)">8.95 / 10</text>
      </g>
    </g>
  </g>

  <!-- Frame Corner Brackets -->
  <path d="M 12 24 L 12 12 L 24 12" stroke="#00F0FF" stroke-width="3" fill="none" filter="url(#waveGlow)" />
  <path d="M 838 24 L 838 12 L 826 12" stroke="#00F0FF" stroke-width="3" fill="none" filter="url(#waveGlow)" />
  <path d="M 12 336 L 12 348 L 24 348" stroke="#00F0FF" stroke-width="3" fill="none" filter="url(#waveGlow)" />
  <path d="M 838 336 L 838 348 L 826 348" stroke="#00F0FF" stroke-width="3" fill="none" filter="url(#waveGlow)" />
</svg>
