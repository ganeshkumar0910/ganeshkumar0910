<svg width="800" height="300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Intelligence Meets Interface Pipeline">
    <rect width="100%" height="100%" fill="#0D1117" rx="5"/>
    <g font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#c9d1d9">
        
        <!-- AI/ML Models -->
        <rect x="300" y="20" width="200" height="40" fill="#161b22" stroke="#00F0FF" stroke-width="1" rx="5"/>
        <text x="400" y="45" text-anchor="middle">AI / ML MODELS</text>
        <line x1="400" y1="60" x2="400" y2="80" stroke="#00F0FF" stroke-width="2" stroke-dasharray="5 5">
            <animate attributeName="stroke-dashoffset" from="10" to="0" dur="1s" repeatCount="indefinite"/>
        </line>
        
        <!-- AI Capabilities -->
        <rect x="300" y="80" width="200" height="40" fill="#161b22" stroke="#00F0FF" stroke-width="1" rx="5"/>
        <text x="400" y="105" text-anchor="middle">AI CAPABILITIES</text>
        <line x1="400" y1="120" x2="400" y2="140" stroke="#00F0FF" stroke-width="2" stroke-dasharray="5 5">
            <animate attributeName="stroke-dashoffset" from="10" to="0" dur="1s" repeatCount="indefinite"/>
        </line>

        <!-- Application Logic -->
        <rect x="300" y="140" width="200" height="40" fill="#161b22" stroke="#B900FF" stroke-width="1" rx="5"/>
        <text x="400" y="165" text-anchor="middle">APPLICATION LOGIC</text>
        <line x1="400" y1="180" x2="400" y2="200" stroke="#B900FF" stroke-width="2" stroke-dasharray="5 5">
            <animate attributeName="stroke-dashoffset" from="10" to="0" dur="1s" repeatCount="indefinite"/>
        </line>

        <!-- Front-End Interface -->
        <rect x="300" y="200" width="200" height="40" fill="#161b22" stroke="#B900FF" stroke-width="1" rx="5"/>
        <text x="400" y="225" text-anchor="middle">FRONT-END INTERFACE</text>
        <line x1="400" y1="240" x2="400" y2="260" stroke="#00F0FF" stroke-width="2" stroke-dasharray="5 5">
            <animate attributeName="stroke-dashoffset" from="10" to="0" dur="1s" repeatCount="indefinite"/>
        </line>

        <!-- User Experience -->
        <rect x="300" y="260" width="200" height="40" fill="#161b22" stroke="#00F0FF" stroke-width="1" rx="5"/>
        <text x="400" y="285" text-anchor="middle" fill="#00F0FF">USER EXPERIENCE</text>
    </g>
</svg>
