<svg width="800" height="200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Front-End Lab">
    <rect width="100%" height="100%" fill="#0D1117" rx="5"/>
    <g transform="translate(400, 100)">
        <rect x="-200" y="-80" width="400" height="160" fill="#0D1117" stroke="#30363d" stroke-width="2" rx="5"/>
        <rect x="-200" y="-80" width="400" height="25" fill="#161b22" rx="5"/>
        <circle cx="-185" cy="-67" r="4" fill="#ff5f56"/>
        <circle cx="-170" cy="-67" r="4" fill="#ffbd2e"/>
        <circle cx="-155" cy="-67" r="4" fill="#27c93f"/>
        <text x="0" y="-63" font-family="Arial, sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">FRONT-END INTERFACE LAB</text>
        
        <g font-family="Courier New, monospace" font-size="12" fill="#c9d1d9" text-anchor="middle">
            <text x="0" y="-20">AI PROCESSING</text>
            <circle cx="0" cy="5" r="5" fill="#00F0FF">
                <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
            </circle>
            <line x1="0" y1="15" x2="-40" y2="40" stroke="#00F0FF" stroke-width="1"/>
            <line x1="0" y1="15" x2="0" y2="45" stroke="#00F0FF" stroke-width="1"/>
            <line x1="0" y1="15" x2="40" y2="40" stroke="#00F0FF" stroke-width="1"/>
            <circle r="2" fill="#ffffff">
                <animateMotion path="M 0 15 L -40 40" dur="1s" repeatCount="indefinite"/>
            </circle>
            
            <text x="0" y="65">INTERACTIVE EXPERIENCE</text>
        </g>
    </g>
</svg>
