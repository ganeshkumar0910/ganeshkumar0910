<svg width="800" height="250" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Research and Retrieval Flow">
    <rect width="100%" height="100%" fill="#0D1117" rx="5"/>
    <g font-family="Arial, sans-serif" font-size="12" fill="#c9d1d9">
        <rect x="50" y="100" width="120" height="40" fill="#161b22" stroke="#00F0FF" rx="5"/>
        <text x="110" y="125" text-anchor="middle">Evidence Repo</text>
        
        <line x1="170" y1="120" x2="250" y2="120" stroke="#30363d" stroke-width="2"/>
        <circle r="3" fill="#ffffff">
            <animateMotion path="M 170 120 L 250 120" dur="1.5s" repeatCount="indefinite"/>
        </circle>

        <rect x="250" y="100" width="120" height="40" fill="#161b22" stroke="#B900FF" rx="5"/>
        <text x="310" y="125" text-anchor="middle">Semantic Retrieval</text>

        <line x1="370" y1="120" x2="450" y2="120" stroke="#30363d" stroke-width="2"/>
        <circle r="3" fill="#ffffff">
            <animateMotion path="M 370 120 L 450 120" dur="1.5s" repeatCount="indefinite"/>
        </circle>

        <rect x="450" y="100" width="120" height="40" fill="#161b22" stroke="#00F0FF" rx="5"/>
        <text x="510" y="125" text-anchor="middle">RL / DQN Feedback</text>

        <line x1="570" y1="120" x2="650" y2="120" stroke="#30363d" stroke-width="2"/>
        <circle r="3" fill="#ffffff">
            <animateMotion path="M 570 120 L 650 120" dur="1.5s" repeatCount="indefinite"/>
        </circle>

        <rect x="650" y="100" width="100" height="40" fill="#161b22" stroke="#00F0FF" rx="5"/>
        <text x="700" y="125" text-anchor="middle">Investigator</text>
    </g>
</svg>
